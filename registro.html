<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <h2>Crear Cuenta</h2>
    
    <div class="error-message" id="error-message" style="display: none;"></div>
    <div class="success-message" id="success-message" style="display: none; background-color: #e8f8f5; color: #1abc9c; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;"></div>

    <form action="registro.php" method="POST">
        <div class="input-group">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Elige un usuario" required>
        </div>
        
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
        </div>
        
        <button type="submit">Registrarse</button>
    </form>
    
    <p style="margin-top: 20px; font-size: 14px;">
        ¿Ya tienes cuenta? <a href="index.html" style="color: #667eea; text-decoration: none;">Inicia sesión aquí</a>
    </p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error')) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.style.display = 'block';
        if (urlParams.get('error') === 'empty') {
            errorDiv.textContent = 'Por favor, completa todos los campos.';
        } else if (urlParams.get('error') === 'exists') {
            errorDiv.textContent = 'El usuario ya existe. Elige otro.';
        } else if (urlParams.get('error') === 'db') {
            errorDiv.textContent = 'Error en la base de datos al registrar.';
        }
    }
    if (urlParams.get('success')) {
        const successDiv = document.getElementById('success-message');
        successDiv.style.display = 'block';
        successDiv.textContent = '¡Cuenta creada! Ya puedes iniciar sesión.';
    }
</script>

</body>
</html>
